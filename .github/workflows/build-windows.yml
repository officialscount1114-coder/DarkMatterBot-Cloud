name: Build Windows EXE

# Builds DarkMatterBot.exe in the cloud - no Windows toolchain needed locally.
# Push a tag (git tag v3.7.1 && git push --tags) or run it by hand from the
# Actions tab; the .exe is attached to the run as a downloadable artifact and,
# for tags, to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      onedir:
        description: "Build a folder instead of a single exe"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Build the executable
        shell: cmd
        run: |
          if "${{ inputs.onedir }}"=="true" (python build.py --onedir) else (python build.py)

      - name: Show the last lines of the build log
        if: always()
        shell: cmd
        run: if exist build.log (powershell -NoProfile -Command "Get-Content build.log -Tail 30")

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: DarkMatterBot-windows
          if-no-files-found: error
          path: |
            dist/**
            releases/*.zip
            build.log

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DarkMatterBot.exe
            releases/*.zip
